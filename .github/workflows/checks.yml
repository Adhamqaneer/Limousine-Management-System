name: Foundation checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python scripts/check_readme.py
      - run: python -m pip install -r requirements.txt
      - run: python manage.py check --settings=limousine.config.settings.test
      - run: python manage.py test tests --settings=limousine.config.settings.test
      - run: python manage.py collectstatic --noinput --settings=limousine.config.settings.base
