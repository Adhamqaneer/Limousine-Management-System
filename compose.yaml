services:
  web:
    build: .
    env_file: .env
    environment:
      HSPACE_ENV: local
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - vehicle_media:/app/media
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  vehicle_media:
